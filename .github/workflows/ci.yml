name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test-pack:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --coverage --coverage-output-format cobertura --results-directory artifacts/test-results

      - name: Pack
        run: dotnet pack src/Serilog.Sinks.Signal/Serilog.Sinks.Signal.csproj --configuration Release --no-build --output artifacts/packages
